name: Audit (the whole workspace)

# `audit` in ci.yml blocks a pull request on what ships: the runtime
# dependencies. This looks at everything, build and test tools included,
# once a week, and says so in an issue when it finds something: an advisory
# in a tool that is in no image is something to fix soon, not a reason to
# stop a change that has nothing to do with it.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit-all:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Audit everything
        id: audit
        run: |
          set +e
          pnpm audit --audit-level moderate > audit.txt 2>&1
          status=$?
          cat audit.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # One open issue at a time: a second run with the same findings adds a
      # comment to it instead of another issue.
      - name: Say so in an issue
        if: steps.audit.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Dependency audit: advisories in the workspace"
          {
            echo "Found by the weekly audit of the whole workspace (build and test tools included) at $(git rev-parse --short HEAD)."
            echo
            echo '```'
            head -c 60000 audit.txt
            echo '```'
          } > body.md
          existing="$(gh issue list --state open --search "in:title ${title}" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi

      - name: Fail the run too
        if: steps.audit.outputs.status != '0'
        run: exit 1
