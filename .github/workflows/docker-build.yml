name: Docker build

# docs/adr/0042. Every PR gets a build-only check (no registry credentials
# needed) — with published images the default distribution path, this is
# the one automated signal that a Dockerfile change didn't break the
# build. Pushes to main (and version tags, once releases start being cut)
# additionally publish to ghcr.io.
#
# The single image (docs/adr/0101, docker/kometio/) comes after the four
# above: it assembles the three apps' images, so on a pull request a job
# rebuilds them and runs the end-to-end suite against the result, and on a
# push the published ones are put together and smoke-tested before the image
# is given its tags.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'themes/**'
      - 'docker/**'
      - '**/Dockerfile'
      # The proxy's own file, which the single image and the compose stack share.
      - 'Caddyfile'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'

permissions:
  contents: read
  packages: write

# One run per branch at a time. On main this keeps the tags in commit
# order: two merges a minute apart used to build side by side, and whichever
# finished last owned `main`, the older commit included. A run waits for the
# one before it, and a newer one replaces any still waiting. On a pull
# request a new push makes the running build pointless, so it is cancelled.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job per image and architecture, each on a runner of that
  # architecture: arm64 builds natively on GitHub's arm64 runners instead of
  # under QEMU, where pnpm install and the Nx builds would take many times
  # as long. Each job pushes its image by digest only; `merge` below puts the
  # two digests of an image behind its tags as one multi-arch image, so a
  # server — or an Apple Silicon Mac — pulls the one for its own CPU.
  build:
    strategy:
      fail-fast: false
      matrix:
        image: [api, public-site, editor-app, public-site-builder]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
          - image: public-site
            dockerfile: apps/public-site/Dockerfile
          - image: editor-app
            dockerfile: apps/editor-app/Dockerfile
          # The public site's workspace, installed and unbuilt, for a theme
          # kept in its own repository (docs/adr/0089). Always published
          # with the same tags as kometio-public-site: a theme is built on
          # one and runs on the other, and the two must match.
          - image: public-site-builder
            dockerfile: apps/public-site/Dockerfile
            target: builder
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # in it is refused.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${OWNER,,}/kometio-${{ matrix.image }}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.IMAGE }}

      # On a pull request this is the build-only check; elsewhere it pushes
      # the image by digest, untagged — the tags come from `merge`.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Keep the digest for merge
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name != 'pull_request'
        with:
          # A dot, not a dash, before the architecture: image names contain
          # dashes, and `digests-public-site-*` also matched
          # public-site-builder's digests, which merge then looked for in the
          # wrong repository.
          name: digests-${{ matrix.image }}.${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: [api, public-site, editor-app, public-site-builder]
    runs-on: ubuntu-24.04
    steps:
      - name: Image name
        run: echo "IMAGE=ghcr.io/${OWNER,,}/kometio-${{ matrix.image }}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}.*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Tag the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        run: |
          digests=(*)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "Expected one digest per architecture, got ${#digests[@]}: ${digests[*]}"
            exit 1
          fi
          args=()
          while read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in "${digests[@]}"; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"

      - name: Check both architectures are there
        env:
          TAG: ${{ steps.meta.outputs.version }}
        run: |
          platforms=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r '[.manifests[].platform | select(.os != "unknown") | .architecture] | sort | join(",")')
          echo "$IMAGE:$TAG: $platforms"
          test "$platforms" = "amd64,arm64"

  # The single image (docs/adr/0101): Postgres, the API, the public site and
  # the editor in one container, assembled from the three images above.
  #
  # On a pull request nothing has been published, so the three are rebuilt
  # here — from the layers the `build` jobs have just cached, which makes it
  # quick — and kept in the local image store, the single image is assembled
  # from them, and docker/kometio/check.sh starts it, proves it works and
  # runs the end-to-end suite against it. amd64 only: the architecture is not
  # what a pull request changes, and the publishing jobs below check both.
  single-image-check:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: 'pnpm'
      # For the browser suite, which runs from the repository, not from an image.
      - run: pnpm install --frozen-lockfile

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Same Dockerfile, same cache scope as the `build` job, read only.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: kometio-api:ci
          cache-from: type=gha,scope=api-amd64
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/public-site/Dockerfile
          load: true
          tags: kometio-public-site:ci
          cache-from: type=gha,scope=public-site-amd64
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/editor-app/Dockerfile
          load: true
          tags: kometio-editor-app:ci
          cache-from: type=gha,scope=editor-app-amd64

      # `--builder default` is the Docker daemon's own builder, the only one
      # that can start from an image that exists only in the local store; the
      # builder set up above runs in a container of its own and cannot.
      - name: Assemble the single image
        run: >
          docker buildx build --builder default
          --file docker/kometio/Dockerfile --tag kometio:ci
          --build-arg API_IMAGE=kometio-api:ci
          --build-arg PUBLIC_SITE_IMAGE=kometio-public-site:ci
          --build-arg EDITOR_IMAGE=kometio-editor-app:ci
          --load .

      # The browser is ~100 MB; cached per Playwright version. Its system
      # libraries are not in the cache and are installed either way (the
      # `e2e` job in ci.yml does the same).
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @kometio/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @kometio/e2e exec playwright install --with-deps chromium
      - if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @kometio/e2e exec playwright install-deps chromium

      # check.sh's server with a name lives at *.localhost, which means this
      # machine to a browser by definition and to a machine's resolver by
      # RFC 6761 (the runner's does not always say so): written down, the
      # names are certain.
      - name: Make the names of the HTTPS check resolve
        run: echo '127.0.0.1 kometio-check.localhost admin.kometio-check.localhost api.kometio-check.localhost www.kometio-check.localhost' | sudo tee -a /etc/hosts

      - run: docker/kometio/check.sh kometio:ci

      # As in the `e2e` job: a trace of every failed test. The stack here is
      # thrown away with the job, and its password is generated for the run.
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: single-image-e2e-report
          path: dist/e2e/
          retention-days: 14

  # After a push, the images above are published, so the single image is put
  # together from THIS commit's own (`sha-…` tags, never `main`, which a later
  # push may already have moved). Each architecture is built on a runner of its
  # own, pushed by digest and smoke-tested from the registry before any tag
  # points at it: a broken image stays an untagged digest.
  single-image:
    if: github.event_name != 'pull_request'
    needs: merge
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Image names
        run: |
          echo "IMAGE=ghcr.io/${OWNER,,}/kometio" >> "$GITHUB_ENV"
          echo "APPS_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.IMAGE }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: build
        with:
          context: .
          file: docker/kometio/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            API_IMAGE=${{ env.IMAGE }}-api:${{ env.APPS_TAG }}
            PUBLIC_SITE_IMAGE=${{ env.IMAGE }}-public-site:${{ env.APPS_TAG }}
            EDITOR_IMAGE=${{ env.IMAGE }}-editor-app:${{ env.APPS_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=single-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=single-image-${{ matrix.arch }}

      # The image as the registry will serve it, by digest. The browser suite
      # ran on the pull request; this proves that what was published starts,
      # sets up, restarts and stops, on this architecture.
      - name: Smoke-test the pushed image
        run: docker/kometio/check.sh "${IMAGE}@${{ steps.build.outputs.digest }}" --smoke-only

      - name: Keep the digest for merge
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # A dot before the architecture, as for the images above.
          name: digests-single-image.${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  single-image-merge:
    if: github.event_name != 'pull_request'
    needs: single-image
    runs-on: ubuntu-24.04
    steps:
      - name: Image name
        run: echo "IMAGE=ghcr.io/${OWNER,,}/kometio" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-single-image.*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Tag the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        run: |
          digests=(*)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "Expected one digest per architecture, got ${#digests[@]}: ${digests[*]}"
            exit 1
          fi
          args=()
          while read -r tag; do args+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in "${digests[@]}"; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"

      - name: Check both architectures are there
        env:
          TAG: ${{ steps.meta.outputs.version }}
        run: |
          platforms=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r '[.manifests[].platform | select(.os != "unknown") | .architecture] | sort | join(",")')
          echo "$IMAGE:$TAG: $platforms"
          test "$platforms" = "amd64,arm64"
