# The main nginx configuration of the single image. The editor's own server
# block (its Content Security Policy, its SPA fallback) is not here: the
# launcher renders it at start from the editor image's template and it is
# included below, so that policy is defined in one place only.
#
# Not Alpine's own file, which logs to files: Docker reads the standard
# streams, and nginx cannot open /dev/stderr when it is a socket, which is what
# a supervisor's pipes are.
daemon off;
user nginx;
worker_processes 1;
pid /run/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    # Every request would be one line per file of the editor's bundle.
    access_log off;

    include /etc/nginx/http.d/*.conf;
}
