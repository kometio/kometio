# The `docker run` in README.md, as a file: `docker compose up -d`.
#
# `name:` is not decoration. Compose names a project after its folder, and
# this folder is called `kometio`, like the repository's own development stack
# (docker-compose.yml at the root): without it, `docker compose down` here
# would treat that stack's containers as its own leftovers.
name: kometio-trial

services:
  kometio:
    image: ghcr.io/kometio/kometio:0.1.0-beta.1
    ports:
      - '4200:80' # the editor
      - '3000:3000' # the API
      - '4322:4322' # the public site
    volumes:
      - kometio-data:/data
    restart: unless-stopped
    # The database needs a few seconds to stop cleanly: after ten, Docker kills it.
    stop_grace_period: 30s
    # A container's log has no limit unless one is given.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    # On a server with a name, instead of the three ports above (README.md, "On a
    # server"): the DNS of the name has to point here first.
    #   ports: ['80:80', '443:443', '443:443/udp']
    #   environment:
    #     DOMAIN: example.com
    #     ACME_EMAIL: you@example.com

volumes:
  kometio-data:
